[package]
name = "locaryn-morph-wsl"
version = "0.1.0-beta.4"
edition = "2021"
description = "Morph Locaryn : donne au modèle l'accès aux distributions WSL (commandes, fichiers, chemins)"
license = "Apache-2.0"

[[bin]]
name = "locaryn-wsl-mcp"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[workspace]
